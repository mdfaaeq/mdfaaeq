  <g clip-path="url(#photoClip)">
    <image href="https://avatars.githubusercontent.com/u/187956147?v=4" x="558" y="60" width="222" height="160" preserveAspectRatio="xMidYMid slice"/>
    <rect x="558" y="60" width="222" height="160" fill="url(#scanlines)"/>
    <rect x="558" y="-40" width="222" height="36" fill="url(#scanGrad)">
      <animate attributeName="y" values="60;180;60" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="20" y1="228" x2="780" y2="228" stroke="#1e3a8a" stroke-opacity="0.35"/>
  <text x="34" y="222" font-family="monospace" font-size="11" fill="#5f7aa8"> </text>
  <text x="20" y="235" font-family="monospace" font-size="11" fill="#5f7aa8">scanning github.com/mdfaaeq...</text>
  <text x="766" y="235" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="end">● live</text>
